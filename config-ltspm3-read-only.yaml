# LTSPM3 -- the two boxes on the GPIB board, READ-ONLY.  A chart recorder and
# nothing else: no `control:` section, so plain `lschart` runs it.
#
#   python -m lschart -c config-ltspm3-read-only.yaml check     validate, touch nothing
#   python -m lschart -c config-ltspm3-read-only.yaml probe     read everything once
#   python -m lschart -c config-ltspm3-read-only.yaml run       record until interrupted
#   python -m lschart.gui -c config-ltspm3-read-only.yaml       the strip chart
#
# Three interlocks are shut here: `transport.read_only` on both boxes,
# `allow_writes` on the 336, `ipc.accept_commands`.  Wiring, addresses and
# box-level changes: docs/ltspm3/cryostat.md.  Running it:
# docs/ltspm3/running.md.  Present state: `data/status.json`, never a comment.

log_level: INFO

# ---------------------------------------------------------------- instruments

instruments:
  # The 218: the three thermometers and the sample-heater readback.
  - name: ls218
    model: "218"
    enabled: true
    driver: visa                # pyvisa -> NI-VISA -> the NI PXI-GPIB board
    transport:
      resource: GPIB0::15::INSTR
      read_only: true           # <-- INTERLOCK.  Leave this on.
      timeout_ms: 3000
      # The 218 ends a reply with a bare LF; the default (CRLF) works only
      # because GPIB asserts EOI.  docs/ltspm3/cryostat.md.
      read_termination: "\n"
      inter_command_delay: 0.05
      # A box power-cycled or taken off the bus must not end the run.
      reconnect: true
      retry_min_s: 1.0
      retry_max_s: 30.0

    # Deliberately non-contiguous: only populated inputs are listed, which
    # keeps dead columns out of the CSV and dead queries out of every cycle.
    # The name is the CSV column, so moving a thermometer costs one line and
    # the column keeps its meaning.  docs/ltspm3/cryostat.md.
    channels:
      1: Sample
      2: Coldplate
      5: Magnet

    # 0 = "this box is only being logged"; `check` reports "records only".
    # Analog output 1 is still READ every cycle as ls218.aout1 (AOUT? is a
    # query), so the log shows what the heater does while something else drives it.
    control_input: 0

    # RDGST? costs one query per channel, so it is polled occasionally rather
    # than every cycle: a fault that matters shows up in the reading itself.
    read_status: true
    status_every_n_cycles: 15

  # The 336: four inputs, both loops' setpoints, both heaters.
  - name: ls336
    model: "336"
    enabled: true
    driver: visa
    transport:
      resource: GPIB0::12::INSTR
      read_only: true           # <-- INTERLOCK.  Leave this on.
      timeout_ms: 3000
      inter_command_delay: 0.05
      reconnect: true
      retry_min_s: 1.0
      retry_max_s: 30.0

    # Empty = ask the box for its own front-panel labels (INNAME?).  Naming the
    # four explicitly is the more stable choice: a column then cannot change
    # meaning because somebody relabelled the front panel mid-run.
    # docs/ltspm3/cryostat.md has the four.
    channels: {}

    read_setpoints: true        # SETP? on each loop -> a column each
    read_heaters: true          # HTR? and RANGE? -> what the heaters are doing
    # Analog outputs 3 and 4 are unused on this cryostat, so this would cost
    # two queries a cycle for two empty columns.
    read_analog_outputs: false
    read_status: true
    status_every_n_cycles: 15

    allow_writes: false         # <-- INTERLOCK.  Leave this off.

# ---------------------------------------------------------------- acquisition

acquisition:
  # 2 s, not the 1 s default: two boxes on one GPIB board do not fit in 1 s at
  # `check`'s transaction budget.  docs/ltspm3/cryostat.md.
  interval_s: 2.0
  log_every_n: 1              # 1 = record every sample.  CSV has no row limit.
  ringbuffer_size: 43200      # 24 h at 2 s, for plotting only -- never the log

recorder:
  enabled: true
  directory: data
  filename_prefix: ltspm3
  flush_every_sample: true    # a power cut should cost one sample, not an hour

runtime:
  # THE SAME LOCK every LTSPM3 config takes: one GPIB board, one holder
  # (invariant 2).  Two recorders interleave transactions and the symptom is
  # garbled replies, not an honest error.
  lock_path: data/ltspm3.lock
  single_instance: true

# ------------------------------------------------------------------------ ipc
#
# status.json for the strip chart and for MATLAB; no command spool.  Reading
# status is one permission and being commanded is another.
ipc:
  enabled: true
  directory: data
  accept_commands: false
