# LTSPM3 -- the SOFTWARE PID.  `config-ltspm3-heater.yaml` plus a `control:`
# section, which is the only difference and is the whole difference.
#
#   python -m lschart -c config-ltspm3-armed.yaml check    REFUSES: `control:`
#   python -m ltspm3  -c config-ltspm3-armed.yaml check    validate, touch nothing
#   python -m ltspm3  -c config-ltspm3-armed.yaml run      record; loop NOT armed
#   python -m ltspm3  -c config-ltspm3-armed.yaml run --arm    close the loop
#
# `lschart` refuses it because `control:` is a section only `ltspm3` registers,
# so a recorder-only install cannot be asked to close a heater loop
# (invariant 1).  Choosing this file is not arming.  Running it:
# docs/ltspm3/running.md.  What is armed right now: HANDOFF.md.
#
# The bench harness reads the CRYOSTAT's limits from here and pins its own
# envelope for the commissioning switches and the speed ratios -- see
# `tests_ltspm3/bench_plant.py`.  Every number below is graded against
# docs/ltspm3/requirements.md.

log_level: INFO

# ---------------------------------------------------------------- instruments

instruments:
  # The 218: three thermometers, and the sample heater on analog output 1.
  - name: ls218
    model: "218"
    enabled: true
    driver: visa
    transport:
      resource: GPIB0::15::INSTR
      read_only: false
      timeout_ms: 3000
      read_termination: "\n"      # the 218 ends a reply with a bare LF; the
                                  # 336 uses the CRLF default.  cryostat.md
      inter_command_delay: 0.05
      reconnect: true
      retry_min_s: 1.0
      retry_max_s: 30.0

    channels:
      1: Sample
      2: Coldplate
      5: Magnet

    # THE DIFFERENCE FROM THE MANUAL FILE: the software loop steers by input 1.
    # A `control:` section with `control_input: 0` is a loop with no sensor.
    control_input: 1

    analog_output: 1
    analog_decimals: 3

    allow_writes: true
    max_output_pct: 70.0          # the ceiling; matches supervisor.hard_max_pct
    verify_writes: false          # the supervisor confirms its own writes
                                  # (`verify_readback`); paying twice would put
                                  # a second transaction in every cycle
    readback_tol_pct: 0.02

    read_status: true
    status_every_n_cycles: 15

  # The 336: loop 2 holds THE CHONKE and is not ours.  docs/ltspm3/cryostat.md.
  - name: ls336
    model: "336"
    enabled: true
    driver: visa
    transport:
      resource: GPIB0::12::INSTR
      read_only: false
      timeout_ms: 3000
      inter_command_delay: 0.05
      reconnect: true
      retry_min_s: 1.0
      retry_max_s: 30.0

    channels: {}
    read_setpoints: true
    read_heaters: true
    read_analog_outputs: false
    read_status: true
    status_every_n_cycles: 15
    allow_writes: true

# ---------------------------------------------------------------- acquisition

acquisition:
  # 2 s (docs/ltspm3/cryostat.md), and the loop's dead time is DERIVED from it
  # together with `filter.median_window`, so changing it changes the delay
  # floor under `tau_cl`.
  interval_s: 2.0
  log_every_n: 1
  ringbuffer_size: 43200

recorder:
  enabled: true
  directory: data
  # A prefix per config, on purpose: the filename is the only thing that will
  # still say what could move the heater during a run.
  filename_prefix: ltspm3-armed
  flush_every_sample: true

runtime:
  lock_path: data/ltspm3.lock     # ONE GPIB board, one holder (invariant 2)
  single_instance: true

# ------------------------------------------------------------------------ ipc

ipc:
  enabled: true
  directory: data
  accept_commands: true
  command_ttl_s: 30.0
  allow_analog_output: true
  allow_heater_range: true

# -------------------------------------------------------------------- control
#
# `enabled: true` builds the loop.  It does NOT close it: that is `run --arm`,
# and it is the act that applies power.

control:
  enabled: true

  supervisor:
    # THE BAND FOLLOWS THE SETPOINT whenever the model has a curve (`has_curve`,
    # not `feedforward.enabled`), widened while a ramp runs by exactly that
    # ramp's lead and clamped by the two hard limits.  So this field is only
    # the fallback centre for a loop with no model, and the output a loop
    # adopts when it has never read one: nothing needs re-centring before a
    # move.  The model's LEVEL is a calibration with a shelf life -- handling
    # the heater wiring moves it -- so the half-width below has to cover
    # whatever level error it carries.  docs/ltspm3/thermal-response.md.
    operating_point_pct: 63.960   # a settled point on the shipped fit
    # The window's HALF-WIDTH, in output percent either side of the centre.
    # Sized to the model's LEVEL ERROR (a half-width below it cuts the heater
    # at arming, pinned by
    # `test_a_band_narrower_than_the_level_error_cuts_the_heater_at_arming`)
    # plus the OVERDRIVE a fast move needs.  Graded on the bench:
    # docs/ltspm3/requirements.md section 3.
    #
    # What it is NOT: the "is the delivered power wrong" threshold.  That is
    # the watt residual's job (`warn_sigma`, `fault_mw` below), and the band
    # must not double as it (Jeff, 2026-09-17).  `hard_max_pct` is still the
    # cap nothing moves.
    authority_pct: 1.0
    hard_min_pct: 0.0
    # THE ONE CAP NOTHING MOVES.  Whatever the model, the setpoint or the
    # arithmetic says, the output cannot exceed this.  Above it the fit is
    # extrapolation and nobody has measured what happens.
    hard_max_pct: 70.0

    # HOW FAST THE HEATER ITSELF MAY TRAVEL, in output percent per minute.
    # NOT the trajectory's kelvin rate divided by the gain, which is what it
    # used to be and what made every move soft with a long tail: a ramp needs
    # `rate * tau / K` of overdrive above where it will finish, and the
    # converted ceiling delivered 0.40 %/min against 3.5 % to travel.  The two
    # are different quantities -- one is about the sample, one is about the
    # heater -- and they are configured apart.
    # docs/ltspm3/requirements.md section 1b, the `slew` row of section 2.
    max_output_rate_pct_per_min: 20.0

    # THE FLOOR UNDER THE FAULT RAMP-DOWN ONLY.  The descent stays in kelvin --
    # it is a trajectory and it has to work with no sensor at all (rule 3) --
    # so it keeps the `ramp.max_rate_k_per_min / K(T)` conversion, asking
    # whether a CURVE exists and not whether a commissioning switch is on.
    # This is what that falls back to where there is no curve.
    # docs/ltspm3/thermal-response.md for K(T).
    min_rate_pct_per_min: 0.20

    # THE PREMISE IS THAT THE WATTS ADD UP.  `dQ` is the same residual the
    # monitor judges by, from the same two model functions, so the loop and the
    # judge cannot disagree about what typical means -- only about what to do.
    # It is valid at a hold AND during a sweep, which a kelvin check is not.
    warn_error_k: 1.0             # WHILE THE SETPOINT IS NOT MOVING.  ALARMS
                                  # and keeps tracking; it does not freeze.
                                  # Below min_output_pct it is the only check
                                  # there is, which is why it is not optional.
    warn_sigma: 3.0               # sigma_q_w from the model
    fault_mw: 10.0                # Jeff, 2026-09-14.  A FLOOR under 3 sigma...
    fault_window_s: 1800.0        # ...and a STEP within half an hour, not a
                                  # level: a change in delivered power lands in
                                  # the residual immediately, and anything that
                                  # takes hours did not step.
    fault_error_k: 5.0            # where the two edges of the band part
                                  # company, while the setpoint is not moving.
                                  # RAILED AT THE CEILING (demand and output
                                  # both) is a FAULT: the loop is giving
                                  # everything it is allowed to and the sample
                                  # still will not come up.  Railed at the
                                  # FLOOR is a WARNING however far it goes --
                                  # less heat than the model expects is the
                                  # safe direction, and a rising coldplate is
                                  # exactly that (Jeff, 2026-09-15).
                                  # No window gates either.
    fault_after_s: 180.0
    min_output_pct: 28.0          # the monitor's number.  Below it dQ is the
                                  # difference of two large numbers and has no
                                  # opinion -- so the kelvin check stays on
                                  # underneath (Jeff, 2026-09-14).
    coldplate_channel: Coldplate  # Lambda(T_s) - Lambda(T_c) needs the sink
    sink_stale_s: 30.0            # and past this the residual has NO OPINION
                                  # rather than running on a remembered one: a
                                  # coldplate moving while the channel is down
                                  # would land in dQ as the sample's problem.

    anomaly_demand_pct: 0.50      # a one-cycle lurch in the FEEDBACK terms is a
                                  # bad reading driving the loop -- about the
                                  # reading, not about the cryostat.

    max_feedforward_pct: 0.40
    # A CEILING ON THE DERIVED VELOCITY FEEDFORWARD, not the value.  The loop
    # computes what a ramp needs as rate*tau/K, and the band widens by the same
    # number, so the drive a ramp needs and the authority it is granted cannot
    # disagree.  This is only the most it may ever come to.
    max_velocity_ff_pct: 6.00
    model_check_slope_k_per_s: 0.002

    # The fault ramp-down descends at THE SAME ONE RATE, in kelvin, through the
    # model's inverse curve -- so it needs no sensor (rule 3: the fault may BE
    # the sensor).
    safe_output_pct: 0.0
    require_ack_after_fault: true

    dac_step_pct: 0.01
    dither: true
    verify_readback: true         # UNVERIFIED ON THE 218 OVER GPIB -- invariant
                                  # 5, and it is checked before arming
    verify_tol_pct: 0.015         # the armed loop's readback check; the 218 driver has
                                  # its own `readback_tol_pct` above
    comms_fault_after_s: 60.0
    on_exit: hold                 # zeroing a live sample heater is its own hazard

  pid:
    kp: 0.02                      # scheduled from `tuning:` whenever
    ti: 900.0                     # control.tuning.enabled -- these are the
    td: 0.0                       # starting values only
    setpoint: 118.3               # `run --arm` with no --setpoint holds the
                                  # present temperature instead of this

  feedforward:
    # This switch governs the positional DRIVE TERM and nothing else: the band
    # follows the setpoint either way.  OFF until the model's level is
    # re-gauged against the heater circuit's delivered power
    # (docs/ltspm3/thermal-response.md), and when it comes on `move_speed` must
    # be re-graded -- the term stacks a level step on a loop that already
    # supplies the drive (docs/ltspm3/requirements.md section 3).
    enabled: false
    # THE SHIPPED FIT, not the CD10 steady-state curve: below the range CD10
    # measured, CD10 was a power law extrapolating out of its own range and the
    # two disagree by more than ten kelvin.  docs/ltspm3/thermal-response.md.
    #
    # `fitted` has no parameters -- it is a table with a cache key.  The three
    # below configure `cd10` only, kept so the pre-refit record reads back.
    source: fitted
    t_bath_k: 4.0
    ref_pct: 63.076
    ref_rise_k: 95.6
    thermal_exponent: 3.158

  guard:
    valid_min_k: 1.0
    valid_max_k: 400.0
    # Two-tier: a genuine cooldown is corroborated on the other inputs and the
    # observed glitch is faster and alone.  docs/ltspm3/safety.md.
    max_slew_k_per_s: 5.0
    corroborate_slew_k_per_s: 0.5
    curvature_ratio: 1.5
    curvature_floor_k: 0.5
    fault_after_s: 600.0          # longer than any observed self-healing glitch
    recover_samples: 5
    recover_samples_from_fault: 15

  coherence:
    sigma: 4.0
    window_s: 30.0
    tau_s: 30.0

  ramp:
    # THE ONE RATE (Jeff, 2026-09-11).  It is the default sweep rate, the rate
    # the post-fault approach walks in at, the rate the open-loop fault
    # ramp-down descends at, and the ceiling on anything a client asks for.
    # A safety ceiling, not a target (docs/ltspm3/requirements.md).
    max_rate_k_per_min: 5.0
    # Corner rounding.  The corner IS the closed-loop response time,
    # `move_speed * tau(T)`, because a trajectory with corners sharper than the
    # loop's own response gives lag in and overshoot out.  This is the FLOOR
    # under it, in dead times, for the cold end where tau is shorter than the
    # measurement; graded on the bench (docs/ltspm3/requirements.md).
    smooth_delays: 8.0
    # WHEN THE SMOOTHED SETPOINT COUNTS AS ARRIVED.  A first-order smoother
    # never reaches its target, so this has to be a tolerance -- and it has to
    # be in kelvin, because the thing being asked is "has it got there".  It
    # was an underflow test on the RATE until 2026-09-18, which is ~18 time
    # constants and cost 9.3 min of `move` gains after a 2 K move that had
    # been inside 50 mK for seven of them.  A tenth of tuning.hold_error_k,
    # under the thermometer noise, and a sixth of a DAC step through the hold
    # gains.
    settled_k: 0.005

  tuning:
    # Gain scheduling.  It is the one commissioning switch that does NOT wait
    # on a re-gauge, and that is why it comes before the feedforward:
    # `feedforward` commands the model's LEVEL, which is stale, while `tuning`
    # reads only K(T) and tau(T) -- the model's SHAPE, which a refit of the
    # level does not move.  The same distinction `has_curve` draws for the
    # fault ramp-down and the output rate limiter.  That the two switches come
    # apart is pinned by `tests_ltspm3/test_stage_4c_tuning.py`.
    #
    # Three things are gated on it: the scheduled gains, the velocity
    # feedforward (the drive a ramp needs) and `ramp_lead_pct` (the authority
    # to use it).  With it off a move arrives late with a `warn_error_k`
    # warning at any rate -- graceful, and useless for an experiment.
    enabled: true
    # RATIOS TO THE PLANT'S OWN TIME CONSTANT, not absolute times, because
    # tau(T) spans orders of magnitude over this cryostat's range:
    #
    #   tau_cl = max(speed * tau(T), delay_floor * delay_s)
    #
    # and above the floor kp is simply 1 / (speed * K(T)).  Both ratios are
    # Jeff's requirements graded on the bench: docs/ltspm3/requirements.md
    # sections 1b and 3, `test_stage_4e_fast_move.py`.
    #
    # `move_speed` NOW PARKS tau_cl ON THE DEAD-TIME FLOOR at every temperature
    # the cryostat is used at, which is where Jeff's fast approach lands it: at
    # 120 K the floor is 4 x 3.0 s = 12 s against 0.02 * 527 s = 10.5 s.  So
    # `delay_floor` -- and under it the 2 s cadence and the median of three --
    # is what sets the speed of a move now, and not this number.  That is a
    # deliberate choice and not a coincidence: Jeff kept the stability margin
    # rather than buying the last 15-20 s with it (section 1b, question 9).
    hold_speed: 0.25              # below 1 = real authority at a hold
    move_speed: 0.03              # tau_cl on the dead-time floor above ~60 K
    delay_floor: 4.0              # x the DERIVED dead time.  THE speed limit now
    # The hysteresis, and it has to straddle the overshoot the move is allowed.
    # A 250 mK overshoot against a 250 mK MOVE threshold is a loop that bounces
    # back into MOVE off its own permitted overshoot and re-drives; 0.40 leaves
    # the settle to the hold gains, which is what "slight adjustment" meant.
    move_error_k: 0.40
    hold_error_k: 0.05            # JEFF'S SETTLE GATE: within 50 mK and staying
    hold_settle_s: 120.0
    # A GUARD, never the thing that sets a gain.  At tau_cl on the floor the
    # schedule asks up to 3.37 %/K at the warm end, and the 1.0 default was
    # quietly setting the gain everywhere above 60 K instead of guarding it.
    # `Tuner.gains_for` logs it if it ever binds again.
    max_kp_pct_per_k: 5.0
    # The gain and time-constant schedule is NOT here and is not a table
    # anywhere: `FittedSchedule` reads K(T) and tau(T) from
    # ltspm3/model/fitted_response.py, so a refit moves the controller and the
    # simulator together and there is no paste to rot.

  filter:
    # NO LOW PASS (Jeff), and the class stays in the chain so that a cryostat
    # whose noise moves into the band where a pole would help is a config edit
    # away.  Where this cryostat's noise lives: docs/ltspm3/noise.md.
    #
    # THESE TWO NUMBERS SET THE LOOP'S DEAD TIME, derived from them and the
    # measured cadence and never typed anywhere; `tau_cl` is floored at
    # `delay_floor` times it.  Widen the median and the loop slows down on its
    # own, which is the point of deriving it.
    tau: 0.0
    median_window: 3
    spike_sigma: 8.0
    stale_after_s: 30.0

# -------------------------------------------------------------------- monitor
#
# The judge runs as its OWN PROCESS beside the recorder and never commands
# anything.  Its section is here so one file describes the whole cryostat.

monitor:
  enabled: true
  warn_mw: 5.0                    # Jeff, 2026-09-14, as a FLOOR under 3 sigma
  fault_mw: 10.0                  # ...and a STEP inside fault_window_s
  fault_window_s: 1800.0
  warn_after_s: 600.0             # long enough that a settling transient is
                                  # not an alarm.  plans/pid-2-monitor.md
