# Nothing ran this suite automatically before, which mattered most for Windows:
# development is macOS, the recorder is deployed on Windows, and the one
# Windows-specific bug found so far (the lock taken on a byte that moved with
# the file position) had been hidden by a skip.  So Windows is in the matrix,
# and skips are treated as failures.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the declared floor in pyproject; 3.13 is what a fresh install
        # gets.  Both ends, so the range in `requires-python` stays honest.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # PySide6 wheels on Linux need these to import at all, and the viewer
      # tests skip themselves if it cannot.  Installing them is what keeps the
      # 88 viewer tests from quietly not running.
      - name: system libraries for headless Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gui]"

      - name: lint
        run: python -m ruff check .

      - name: tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -rs --junitxml=report.xml

      # A skip is how this suite lost its only tests on real data: a relative
      # path made them vanish with the message "reference logs not present"
      # whenever pytest ran from anywhere but the repo root.  Every skip left
      # is conditional on something CI is supposed to provide, so any skip here
      # means CI is not testing what it claims to.
      - name: no test may skip in CI
        if: always()
        shell: python
        run: |
          import sys, xml.etree.ElementTree as ET
          suite = ET.parse("report.xml").getroot().find("testsuite")
          skipped, tests = int(suite.get("skipped")), int(suite.get("tests"))
          print(f"{tests} tests, {skipped} skipped")
          if skipped:
              print("::error::tests skipped in CI -- a dependency or fixture is missing")
              sys.exit(1)
