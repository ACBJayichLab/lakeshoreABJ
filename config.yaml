# lschart configuration -- the worked example, on simulated boxes.  Anything
# omitted takes its default from lschart/config.py; unknown keys are a hard
# error, because a dropped typo in a safety limit is the failure this prevents.
#
#   python -m ltspm3 -c config.yaml check      validate, touch nothing
#   python -m ltspm3 -c config.yaml run        record
#   python -m ltspm3 -c config.yaml run --arm  close the heater loop
#
# It carries a `control:` section, which `ltspm3` registers on import, so plain
# `lschart` refuses it: a recorder-only install must not silently ignore a
# request to drive a heater (invariant 1).  GOING LIVE is the two `driver:`
# lines below and nothing else.  docs/ltspm3/running.md.

log_level: INFO

# ---------------------------------------------------------------- instruments

instruments:
  # `driver:` is how bytes reach the box, and it is the ONLY line that changes
  # between the bench and the cryostat:
  #     sim        an in-process fake -- no hardware, no VISA, no serial port
  #     visa       pyvisa: GPIB (needs the NI-VISA runtime on Windows)
  #     lakeshore  Lake Shore's own driver: USB/serial and TCP, NO VISA needed
  #
  # GOING LIVE is changing `sim` to `visa` on both boxes below.  No code change.

  - name: ls218
    model: "218"
    enabled: true
    driver: sim               # <-- "visa" to talk to the real box
    transport:
      resource: GPIB0::15::INSTR
      inter_command_delay: 0.05
    channels:                 # {input number: display name}; only these are read
      1: Sample
      2: Coldplate
      5: Magnet         # docs/ltspm3/cryostat.md for the input map
    control_input: 1          # the sample -- this is what the software PID controls
    # Polling RDGST? for every input costs 8 transactions a cycle and is the
    # single thing that makes a 1 s cadence impossible.  Poll it occasionally
    # instead: a fault that matters shows up in the reading itself immediately.
    read_status: false
    status_every_n_cycles: 15
    analog_output: 1          # the heater.  ANALOG 1, 0, 2, 1, 1,1,1,<percent>

  - name: ls336
    model: "336"
    enabled: true
    driver: sim               # <-- "visa" to talk to the real box
    transport:
      resource: GPIB0::12::INSTR
    channels: {}              # empty = ask the instrument (INNAME?)
    read_setpoints: true
    read_heaters: true
    # Loop 2 independently holds THE CHONKE and is not ours
    # (docs/ltspm3/cryostat.md).  This software records the 336 and stays out
    # of its way.  Leave this false.
    allow_writes: false

# ---------------------------------------------------------------- acquisition

acquisition:
  # 2 s: two boxes on one GPIB board do not fit in 1 s at `check`'s transaction
  # budget, and a cadence the bus cannot hold is dropped cycles, not speed.
  # docs/ltspm3/cryostat.md.  Measure before lowering it.
  interval_s: 2.0
  log_every_n: 1            # 1 = record every sample.  CSV has no row limit.
  ringbuffer_size: 43200    # 24 h at 2 s, for plotting only -- never the log

recorder:
  enabled: true
  directory: data
  # A prefix per config, on purpose: the filename is the only thing that will
  # still say what could move the heater during a run.
  filename_prefix: ltspm3-pid
  flush_every_sample: true  # a power cut should cost one sample, not an hour

runtime:
  # THE SAME LOCK every LTSPM3 config takes: one GPIB board, one holder
  # (invariant 2), and one `data/status.json`.
  lock_path: data/ltspm3.lock
  single_instance: true

# -------------------------------------------------------------------- control
#
# Leave enabled: false for a pure chart recorder.  Arming is never implicit
# even when this is true -- it takes `run --arm`.

control:
  enabled: false

  supervisor:
    # THE BAND FOLLOWS THE SETPOINT whenever the model has a curve, so this is
    # only the fallback centre for a loop with no model, and the output a loop
    # adopts when it has never read one.  Nothing to re-centre before arming.
    operating_point_pct: 63.076   # a settled point from the steady-state curve
    authority_pct: 1.0            # the window's HALF-WIDTH, in output percent.
                                  # Sized to the model's level error plus the
                                  # overdrive a fast move needs;
                                  # docs/ltspm3/requirements.md section 3
    hard_min_pct: 0.0
    hard_max_pct: 70.0
    # The output rate is `ramp.max_rate_k_per_min / K(T)` -- the one rate
    # through the gain -- and this is only the floor under it where the model
    # has no opinion.  docs/ltspm3/thermal-response.md for K(T).
    min_rate_pct_per_min: 0.20

    # Premise checks, IN WATTS: `dQ` against the model's own band, the same
    # residual the monitor judges by.  Beyond 3 sigma it alarms and keeps
    # tracking; a STEP of fault_mw inside fault_window_s faults, as does an
    # error past fault_error_k with the loop railed at the CEILING of its band
    # (railed at the floor with the same error is a warning: less heat than the
    # model expects is the safe direction).
    warn_error_k: 1.0             # while the setpoint is not moving.  At the
                                  # cold end, below min_output_pct, it is the
                                  # only check there is
    warn_sigma: 3.0
    fault_mw: 10.0
    fault_window_s: 1800.0
    fault_error_k: 5.0
    fault_after_s: 180.0
    min_output_pct: 28.0
    coldplate_channel: Coldplate
    sink_stale_s: 30.0            # past this the residual has no opinion
    anomaly_demand_pct: 0.50

    # Fault response.  Nothing here ever raises the heater.  The ramp-down
    # descends at THE ONE RATE, in kelvin, through the model's inverse curve,
    # so it needs no sensor -- rule 3 says the fault may BE the sensor.  Not an
    # emergency stop: a fast change is the larger risk (invariant 6).
    safe_output_pct: 0.0
    # Once a ramp-down starts, AUTOMATION may not undo it -- a recovering sensor
    # does not resume the loop.  An operator still can: `send hold` freezes the
    # heater where it is from any state.  `send ack` is the only way out of a
    # completed one, and it leaves the loop disarmed.
    require_ack_after_fault: true

    dac_step_pct: 0.01
    dither: true                  # sub-code resolution by averaging.  Averaging
                                  # voltage is not averaging power (P ~ V^2),
                                  # but the bias is microkelvin: ignorable.
    verify_readback: true
    on_exit: hold                 # zeroing a live sample heater is its own hazard

  # PID gains are SCHEDULED from the tuning section below whenever
  # control.tuning.enabled is true; these are only the starting values.
  pid:
    kp: 0.02
    ti: 900.0
    td: 0.0
    setpoint: 96.0                # `run --arm` with no --setpoint holds the
                                  # present temperature instead of this

  # The positional feedforward DRIVE TERM, and nothing else -- the band follows
  # the setpoint whether this is on or off.  It commands the model's LEVEL, so
  # it is only trustworthy in the regime the curve was measured in (cryocooler
  # running, shields cold); off, the integral does the work, slower and always
  # correct.  docs/ltspm3/thermal-response.md.
  feedforward:
    enabled: true
    # `fitted` (the shipped ODE fit) or `cd10` (the steady-state curve).  They
    # disagree where CD10 never measured and was extrapolating a power law.
    # The three fields below configure `cd10` only.
    source: fitted
    t_bath_k: 4.0
    ref_pct: 63.076
    ref_rise_k: 95.6
    # `cd10` only: the output is a VOLTAGE into a stable heater, so P ~ pct**2
    # exactly and only the thermal part is fitted, dT ~ P**thermal_exponent.
    # docs/ltspm3/thermal-response.md.
    thermal_exponent: 3.158
    # Leave `calibration` unset to use the measured curve in ltspm3/model/thermal_response.py.

  guard:
    valid_min_k: 1.0
    valid_max_k: 400.0
    # Two-tier, because one number cannot separate a genuine cooldown from the
    # observed sensor glitch: the glitch is faster and uncorroborated.
    # docs/ltspm3/safety.md for the glitch statistics.
    max_slew_k_per_s: 5.0         # hard physical impossibility, always rejected
    corroborate_slew_k_per_s: 0.5 # above this, another channel must agree
    # Reversal test: a real thermal signal is smooth, the glitch is not.
    curvature_ratio: 1.5
    curvature_floor_k: 0.5
    # Longer than the longest observed self-healing glitch, so a sensor burp
    # does not cost a cooldown.  docs/ltspm3/safety.md.
    fault_after_s: 600.0
    recover_samples: 5
    recover_samples_from_fault: 15

  coherence:
    sigma: 4.0                    # "did another channel move at all"
    window_s: 30.0
    tau_s: 30.0

  ramp:
    # THE ONE RATE: sweeps, the post-fault approach and the fault ramp-down.
    max_rate_k_per_min: 5.0
    # The corner IS the closed-loop response time, `move_speed * tau(T)`, and
    # this is the floor under it in dead times.  A trajectory with corners
    # sharper than the loop's own response cannot be followed.
    smooth_delays: 8.0

  # Gain scheduling, from two LOCAL numbers: gain K(T) and time constant
  # tau(T), which are what a step test measures.  IMC/pole-cancellation gives
  # Ti = tau and Kp = tau/(K*tau_cl), so tau_cl -- the closed-loop response
  # time -- is the only number to choose.  The schedule is not a table here:
  # `FittedSchedule` reads K(T) and tau(T) from ltspm3/model/fitted_response.py,
  # so a refit moves the controller with it.  A cryostat with a measured table
  # can still supply one as `schedule:`.
  tuning:
    enabled: true
    # RATIOS to the plant's own tau(T), not absolute times -- see
    # ltspm3/control/tuning.py.  tau_cl = max(speed * tau(T), 4 * delay_s).
    # Both graded on the bench: docs/ltspm3/requirements.md section 3.
    hold_speed: 0.25              # below 1 = real authority at a hold
    move_speed: 0.15              # a 2 K move at 118 K in ~5 min
    delay_floor: 4.0              # x the derived dead time
    move_error_k: 0.25            # enter MOVE above this error
    hold_error_k: 0.10            # return to HOLD below this...
    hold_settle_s: 120.0          # ...and only after settling this long

  filter:
    # NO LOW PASS (Jeff).  `tau: 0` is pass-through and the class stays in the
    # chain, so a cryostat whose noise moves into the band where a pole would
    # help is a config edit away.  Where this cryostat's noise lives, and what
    # a pole buys against it: docs/ltspm3/noise.md.
    tau: 0.0
    # Three, not five.  Five rejects a two-sample glitch silently; three lets
    # it reach the guard, which rejects it by slew and SAYS SO.  It also halves
    # the median's group delay, the largest term in the loop's derived dead time.
    median_window: 3
    spike_sigma: 8.0
    stale_after_s: 30.0           # past this the stored trend is not about now

# --------------------------------------------------------------- simulation
# Only consulted when a transport backend is "sim".

sim:
  start_k: 96.0
  seed: 49181
  # NOTE: speedup accelerates the thermal response but NOT the controller, which still
  # integrates in real time.  Fine for exercising the recorder; meaningless for
  # closed-loop behaviour.  Use the virtual-clock harness in tests/ for that.
  speedup: 1.0
