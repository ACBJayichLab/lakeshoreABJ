# LTSPM3 -- the two boxes on the GPIB board, with the SAMPLE HEATER LIVE.
# `config-ltspm3-read-only.yaml` with the write path opened for MANUAL control:
# the 218's analog output 1 (the sample heater) and the 336's own loops.  There
# is no `control:` section, so plain `lschart` runs it and every percentage it
# sends was typed by a person.
#
#   python -m lschart -c config-ltspm3-heater.yaml check     validate, touch nothing
#   python -m lschart -c config-ltspm3-heater.yaml probe     read everything once
#   python -m lschart -c config-ltspm3-heater.yaml run       record, and listen
#   python -m lschart -c config-ltspm3-heater.yaml send analog 5.0
#   python -m lschart -c config-ltspm3-heater.yaml send heaters_off
#
# Opened: `transport.read_only` and `allow_writes` on both boxes,
# `ipc.accept_commands`, `ipc.allow_analog_output`, `ipc.allow_heater_range`.
# Shut: `ipc.allow_pid`.  Open by omission: `ipc.sources` -- see that section.
# Both power gates cover ZERO as well as anything above it; `send heaters_off`
# and `send hold` are exempt and are what an abort uses.
#
# The 218 has no range, so its ONE number IS the power and `max_output_pct` is
# the guard that matters most -- the local gain is several kelvin per percent
# (docs/ltspm3/thermal-response.md), so a misplaced decimal point is not a
# small mistake.  The ceiling is not a ramp or a step limit: `send analog 60`
# from 0 goes there as fast as the cryostat allows.  Wiring, addresses and
# box-level changes: docs/ltspm3/cryostat.md.  Running it:
# docs/ltspm3/running.md.  Present state: `data/status.json`, never a comment.

log_level: INFO

# ---------------------------------------------------------------- instruments

instruments:
  # The 218: three thermometers, and the sample heater on analog output 1.
  - name: ls218
    model: "218"
    enabled: true
    driver: visa                # pyvisa -> NI-VISA -> the NI PXI-GPIB board
    transport:
      resource: GPIB0::15::INSTR

      # <-- OPENED.  The byte-level interlock is off for this box, so a bug
      # above this layer can now reach the instrument.  `allow_writes` below
      # is the only remaining driver-level gate.
      read_only: false

      timeout_ms: 3000
      # The 218 ends a reply with a bare LF; the default (CRLF) works only
      # because GPIB asserts EOI.  docs/ltspm3/cryostat.md.
      read_termination: "\n"
      inter_command_delay: 0.05
      reconnect: true
      retry_min_s: 1.0
      retry_max_s: 30.0

    # Deliberately non-contiguous: only populated inputs are listed, which
    # keeps dead columns out of the CSV and dead queries out of every cycle.
    # The name is the CSV column, so moving a thermometer costs one line and
    # the column keeps its meaning.  docs/ltspm3/cryostat.md.
    channels:
      1: Sample
      2: Coldplate
      5: Magnet

    # 0: what a SOFTWARE loop would steer by, and there is no software loop
    # here -- that is `ltspm3`, a different program.
    control_input: 0

    analog_output: 1
    analog_decimals: 3

    # <-- OPENED.  Permits the ANALOG command, the only write on this box.
    allow_writes: true

    # THE CEILING, and the guard that matters most here (header).  It matches
    # the supervisor's `hard_max_pct`; above it the model extrapolates.
    max_output_pct: 70.0

    # Confirm every write by reading AOUT? back: these boxes apply commands
    # asynchronously (invariant 5) and a stale readback looks like success.
    verify_writes: true

    # How far the readback may sit from what was commanded and still count.
    # Two DAC codes -- tighter than any step an operator types, loose enough
    # that a write that worked is not failed by AOUT?'s two decimals.
    readback_tol_pct: 0.02

    read_status: true
    status_every_n_cycles: 15

  # The 336: WRITABLE.  Loop 2 holds THE CHONKE and is not
  # ours (docs/ltspm3/cryostat.md), so check which loop you are addressing
  # before sending anything.  status.json's loop table -- the box's own
  # OUTMODE? -- says which sensor each loop reads and what it is doing.
  - name: ls336
    model: "336"
    enabled: true
    driver: visa
    transport:
      resource: GPIB0::12::INSTR
      read_only: false           # <-- OPENED.  Bytes that change state may
                                 #     leave this program for this box.
      timeout_ms: 3000
      inter_command_delay: 0.05
      reconnect: true
      retry_min_s: 1.0
      retry_max_s: 30.0

    channels: {}                # ask the box for its own front-panel labels

    read_setpoints: true
    read_heaters: true
    read_analog_outputs: false
    read_status: true
    status_every_n_cycles: 15

    allow_writes: true         # <-- OPENED.  Permits SETP, RANGE, PID and RAMP
                               #     on this box.  Driver policy, so it gates
                               #     `set` at the CLI as well as the file path;
                               #     `send pid` also needs ipc.allow_pid, off.
                               #     No max_setpoint_k here, so the 350 K
                               #     default is all that stands between a typo
                               #     and a loop.

# ---------------------------------------------------------------- acquisition

acquisition:
  # 2 s, as in the read-only config.  A command is applied once per cycle, so
  # this is also the worst-case latency from `send` to the heater moving.
  interval_s: 2.0
  log_every_n: 1
  ringbuffer_size: 43200

recorder:
  enabled: true
  directory: data
  # A prefix per config, on purpose: the filename is the only thing that will
  # still say what could move the heater during a run.
  filename_prefix: ltspm3-heater
  flush_every_sample: true

runtime:
  # THE SAME LOCK every LTSPM3 config takes: one GPIB board, one holder
  # (invariant 2).
  lock_path: data/ltspm3.lock
  single_instance: true

# ------------------------------------------------------------------------ ipc

ipc:
  enabled: true
  directory: data

  # <-- OPENED.  The recorder owns the GPIB board exclusively, so this is the
  # only way to move the heater without stopping the log.
  accept_commands: true

  # A command older than this is refused rather than applied: a recorder that
  # was down must not come back and replay a backlog into a live cryostat.
  command_ttl_s: 30.0

  # <-- OPENED: the sample heater is movable from a file, in EITHER direction
  # (`analog 0` needs it too -- invariant 3).
  allow_analog_output: true

  # <-- OPENED, and the one to think hardest about: a file may change a 336
  # heater range, which is the act that applies power there, and heater 2 holds
  # THE CHONKE (docs/ltspm3/cryostat.md).  Zero needs it too.
  allow_heater_range: true

  # <-- OPEN BY OMISSION -- the seventh interlock, and the only one that gates
  # the ASKER rather than the action.  Empty means any process that can write
  # into `data/commands` may command this heater.  Left open deliberately:
  # naming the clients flips `default:` to false and a client under a fourth
  # label is refused mid-run, which availability outranks (invariant 6).
  # `sources.json` narrows it at runtime and can never widen it.
  #
  # sources:
  #   lschart-cli: true
  #   matlab: true
  #   ltspm3-sweep: true
  #   default: false
