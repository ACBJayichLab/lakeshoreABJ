[project]
name = "lschart"
version = "0.1.0"
description = "Lake Shore 218/336 chart recorder + software PID sample-heater control"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pyvisa>=1.14",
    "pyqtgraph>=0.13",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "xlrd>=2.0"]

[project.scripts]
lschart = "lschart.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
