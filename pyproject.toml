[project]
name = "lschart"
version = "0.1.0"
description = "Lake Shore 218/336 chart recorder + software PID sample-heater control"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pyvisa>=1.14",
]

# The recorder process must be able to run without Qt.  It is the thing that
# has to stay up for months, and every dependency it does not have is a
# dependency that cannot break it -- so the viewer, which is a *separate*
# process reading status.json and the CSV, carries its own.
[project.optional-dependencies]
# Lake Shore's own driver: USB/serial and TCP, no VISA runtime needed.  This is
# the supported path for a 335 on a COM port; the pyvisa path stays for GPIB.
serial = ["lakeshore>=1.10"]
gui = ["pyqtgraph>=0.13", "PySide6>=6.6"]
dev = ["pytest>=8.0", "xlrd>=2.0", "ruff>=0.6"]

[project.scripts]
lschart = "lschart.__main__:main"
# The viewer is a separate *process*, so it gets its own entry point rather
# than a subcommand: `lschart run` and `lschart-view` are meant to be running
# at the same time, in different terminals, on different machines if the data
# directory is shared.
lschart-view = "lschart.gui.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Explicit, because auto-discovery cannot cope with `reference/` and `data/`
# sitting alongside the packages -- and because the split adds `ltspm3`, which
# must be picked up without anything else changing here.
[tool.setuptools.packages.find]
include = ["lschart*", "ltspm3*"]

# Deliberately narrow.  `F` (pyflakes) is what would have caught the dead
# imports and the `importorskip` for a dependency that is not optional; `E9` is
# syntax and runtime errors.  Style rules are left off on purpose -- the layout
# here is a house style, not an accident, and 88 columns would reflow 82 lines
# of it to no benefit.  100 is what the code already keeps to.
[tool.ruff]
line-length = 100
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["F", "E9", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_ltspm3"]
