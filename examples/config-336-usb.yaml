# Lake Shore 336 on USB — READ-ONLY.
#
# Cryostat state when this was written (2026-08-24): cryo OFF, at atmosphere,
# everything at room temperature.  Expect all four inputs near 295-297 K.
#
#   A  Coldplate    ~295 K   (loop 1 setpoint)
#   B  Stage 2      ~297 K   (loop 2 setpoint)
#   C  Rad Shield   ~296 K   (loop 3 setpoint)
#   D  Stage 1      ~295 K   (loop 4 setpoint)
#
# SAFETY.  Two independent interlocks, both on:
#
#   transport.read_only: true   refuses to transmit ANY command, at the layer
#                               where bytes leave -- so a bug anywhere above
#                               it still cannot write.
#   allow_writes: false         driver policy: no SETP / RANGE / PID.
#
# Turning either off is a deliberate, reviewed act.  Do not do it to "test
# whether writing works".
#
#   python -m lschart -c examples/config-336-usb.yaml probe    read everything once
#   python -m lschart -c examples/config-336-usb.yaml run      record continuously
#
# `probe` forces read_only on regardless of what this file says.

log_level: INFO

instruments:
  - name: ls336
    model: "336"
    driver: lakeshore         # Lake Shore's own driver: USB serial, no VISA
    transport:
      # This box enumerates as USB VID 0x1FB9 / PID 0x0301 through a Silicon
      # Labs CP210x bridge, serial LSA26E0.  Matching on the serial number
      # rather than the port is what survives a re-enumeration: after a replug
      # the port number changes and the serial does not, so leave com_port
      # empty when this is set.
      #
      # Do NOT blank both.  At least one of serial_number / com_port /
      # ip_address must name the box, and the config is REFUSED otherwise --
      # "uses the lakeshore driver but names no com_port, serial_number or
      # ip_address".  The vendor driver would happily scan and grab whichever
      # Lake Shore answers first; naming the box is what stops a second
      # instrument on the bench from being recorded as this one.
      serial_number: "LSA26E0"
      com_port: ""
      baud_rate: 57600        # the 336's fixed USB rate (57600, 7-O-1)
      timeout_ms: 3000

      read_only: true         # <-- INTERLOCK.  Leave this on.

      # A USB device that re-enumerates comes back under the same serial, so
      # reconnection actually works here.
      reconnect: true
      retry_min_s: 1.0
      retry_max_s: 30.0

    # The cryostat as labelled.  Set explicitly rather than read from the front
    # panel, so a column never silently changes meaning if someone relabels
    # the instrument mid-run.
    channels:
      A: Coldplate
      B: Stage 2
      C: Rad Shield
      D: Stage 1

    # MEASURED on this box over USB (2026-08-24, 120 s at 1 Hz):
    # a 9-transaction cycle fits inside 1 s comfortably; the 13-transaction
    # cycle that adds the four RDGST? queries does not -- it takes ~1.25 s.
    # With status_every_n_cycles: 15 that is 7 slow cycles in 119, and NONE
    # were dropped: the poller schedules from a fixed deadline, so a long
    # cycle is followed by a short one and the median stays exactly 1.000 s.
    # Raise this number, or set read_status: false, if you want the margin.
    read_status: true
    status_every_n_cycles: 15
    read_setpoints: true      # SETP? 1-4
    read_heaters: true        # HTR? and RANGE? on outputs 1 and 2

    # Outputs 3 and 4 are analog-only: no range, and AOUT? is the whole of
    # what they are doing.  Read so the viewer's loop table can fill in the
    # output column for loops 3 and 4 rather than leaving them blank.
    read_analog_outputs: true

    # OUTMODE? per loop -- which input it reads and whether it is in closed
    # loop -- plus RAMPST?.  Read at startup and once a minute after that;
    # OUTMODE changes approximately never.  This is where the loop table's
    # sensor column comes from, and it is the instrument's answer rather than
    # a map kept in this file that could go stale.
    read_loops: true
    loop_every_n_cycles: 30

    # PID? per loop, on that same slow cadence.  This is the only way P, I and
    # D reach the viewer: it holds no port and cannot ask the box anything.
    # Off in the shipped defaults because one more transaction per loop does
    # not fit a 1 s cadence; it fits comfortably at the 2 s this file runs.
    read_pid: true

    # How far each loop may sit from its setpoint and still count as settled,
    # in kelvin.  Per loop because 0.5 K is a tight tolerance at 4 K and a
    # loose one at 300 K.  A loop left out of this simply gets no
    # "not settled" mark -- there is no default that would be right for two
    # different loops.
    loop_thresholds:
      1: 0.5
      2: 1.0
      3: 1.0
      4: 1.0

    allow_writes: false       # <-- INTERLOCK.  Leave this off.

acquisition:
  # 2 s, not 1 s.  A full frame on this box is 27 transactions -- four inputs,
  # four setpoints, heaters, analog outputs, and the slow tick's OUTMODE?,
  # RAMPST? and PID? burst -- which is 1.35 s at 50 ms pacing.  `check` refuses
  # a cadence a cycle cannot fit rather than letting the poll silently drift,
  # so raising it here is not a preference, it is the arithmetic.  Drop
  # read_analog_outputs and read_pid if you want 1 Hz back.
  interval_s: 2.0
  log_every_n: 1
  ringbuffer_size: 43200      # 24 h at 0.5 Hz, for plotting only

recorder:
  enabled: true
  directory: data
  filename_prefix: ls336
  flush_every_sample: true

runtime:
  lock_path: data/ls336.lock

# The file interface: status.json for the viewer, and a command spool.
#
# Reading is on; commanding is off, and would be refused twice over anyway --
# `allow_writes: false` above, and `read_only: true` below it.  This box is
# for watching.
#
#   python -m lschart.gui -c examples/config-336-usb.yaml      the strip chart
#   python -m lschart -c examples/config-336-usb.yaml status   one-shot digest
ipc:
  enabled: true
  directory: data
  accept_commands: false
