# lschart — a single Lake Shore 335 on a USB/serial port.
#
# The 335 runs its own PID loop into its own heaters.  This software records
# every input continuously and hands that loop a setpoint; it never computes a
# control output itself.  (The software PID is a separate package, `ltspm3`,
# and is specific to one cryostat.)
#
#   python -m lschart -c config-335-usb.yaml check     validate, touch nothing
#   python -m lschart -c config-335-usb.yaml run       record until interrupted
#
# Install:  pip install "lschart[serial,gui]"
# No NI-VISA runtime is needed for this configuration.

log_level: INFO

instruments:
  - name: ls335
    model: "335"
    driver: lakeshore         # Lake Shore's own driver: serial/USB, no VISA
    transport:
      com_port: COM10         # Windows; on Linux/macOS "/dev/tty.usbserial-..."
      # Better than com_port where you know it: a USB device that
      # re-enumerates comes back on a different port number but the same
      # serial number, so this is what survives a replug.  Set com_port to ""
      # if you use it -- but do NOT blank both.  At least one of
      # serial_number / com_port / ip_address must name the box, and the
      # config is refused outright otherwise.
      serial_number: ""
      baud_rate: 57600        # the 335's factory default (57600, 7-O-1)
      timeout_ms: 3000

    # Empty means "ask the instrument for the labels set on its front panel"
    # (INNAME?).  Name them here to override:
    #   channels: {A: Sample, B: Cold Head}
    channels: {}

    read_setpoints: true      # SETP? on both loops -> a log column each
    read_heaters: true        # HTR? and RANGE? on both outputs

    # OUTMODE? per loop -- which input it reads and whether it is in closed
    # loop -- plus RAMPST?.  Read at startup and once a minute after that;
    # OUTMODE changes approximately never.  This is where the viewer's loop
    # table gets its sensor column, and it is the instrument's answer rather
    # than a map kept in this file that could go stale.
    read_loops: true
    loop_every_n_cycles: 30

    # PID? per loop, on that same slow cadence.  This is the only way P, I and
    # D reach the viewer: it holds no port and cannot ask the box anything.
    # Off in the shipped defaults because one more transaction per loop does
    # not fit a 1 s cadence; it fits comfortably at the 2 s this file runs.
    read_pid: true

    # How far each loop may sit from its setpoint and still count as settled,
    # in kelvin.  Per loop because 0.5 K is a tight tolerance at 4 K and a
    # loose one at 300 K.  A loop left out of this gets no "not settled" mark
    # at all -- there is no default that would be right for two different
    # loops, so this software declines to invent one.
    loop_thresholds:
      1: 0.5
      2: 1.0

    # Writes are OFF by default.  Turn this on for a box this software is meant
    # to drive; leave it off for one that is only being watched.  It gates the
    # setpoint, the heater range and the loop's PID gains alike.
    allow_writes: true

    # A blunt guard against a typo'd setpoint: refused in software rather than
    # politely forwarded to a cryostat.  Set it to whatever your cryostat should
    # never exceed.
    max_setpoint_k: 330.0

acquisition:
  interval_s: 1.0
  log_every_n: 1              # 1 = record every sample.  CSV has no row limit.
  ringbuffer_size: 43200      # 12 h at 1 Hz, for plotting only -- never the log

recorder:
  enabled: true
  directory: data
  filename_prefix: ls335
  flush_every_sample: true    # a power cut should cost one sample, not an hour

runtime:
  lock_path: data/ls335.lock

# The file interface.  This is how MATLAB and the strip chart reach this
# recorder -- and the only way they can, because a COM port has exactly one
# holder and this process is holding COM10.
#
#   python -m lschart -c CONFIG run           the recorder (holds the port)
#   python -m lschart.gui -c CONFIG           the strip chart, another process
#   python -m lschart -c CONFIG send ping     prove the command path works
#
# and from MATLAB, with `matlab/` on the path:
#
#   ls = LakeShore('C:\lschart\data');
#   ls.temperature('Sample')
#   ls.setSetpoint(1, 77.0);
ipc:
  enabled: true
  directory: data           # status.json and commands/ live here, beside the CSV

  # Reading status is one permission; being commanded is another.  This one is
  # ON here because driving this box from MATLAB is the whole point of this
  # cryostat -- but note it is not sufficient on its own: `allow_writes: true` on
  # the instrument above still gates every write, and a read-only box refuses
  # a file command exactly as it refuses one typed at the CLI.
  accept_commands: true

  # A command older than this is refused rather than applied.  Without it, a
  # recorder that was down for an hour comes back, finds an hour of queued
  # setpoints, and walks the cryostat through all of them.  The last one would
  # even be correct -- the hazard is the traversal, not the destination.
  command_ttl_s: 30.0

  # Raising a heater range is the command that actually applies power.  Leave
  # this off unless an unattended script genuinely has to turn a heater on
  # with nobody at the terminal.  Turning one OFF is always allowed.
  allow_heater_range: false
